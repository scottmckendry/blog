version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns:
          - "*"
    ignore:
      # Next.js pins postcss — can't bump without breaking dep constraint
      - dependency-name: "postcss"
        update-types: ["version-update:semver-patch"]
